<app-navbar></app-navbar>

<div class="reset-page">
  <div class="reset-wrapper">
    <h2>Új jelszó megadása</h2>
    <p class="subtext">
      Add meg az új jelszavadat a fiókodhoz.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="info-box">
        <span>Email:</span>
        <strong>{{ email || 'Nincs megadva' }}</strong>
      </div>

      <div class="field">
        <label for="password">Új jelszó</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Minimum 8 karakter"
          required
        >
      </div>

      <div class="field">
        <label for="password_confirmation">Új jelszó megerősítése</label>
        <input
          type="password"
          id="password_confirmation"
          formControlName="password_confirmation"
          placeholder="Írd be újra a jelszót"
          required
        >
      </div>

      <div class="back-wrapper">
        <a class="back-link" routerLink="/login">Vissza a bejelentkezéshez</a>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Folyamatban…' : 'Jelszó módosítása' }}
      </button>

      <p id="msg" [class.error]="msgType==='error'" [class.success]="msgType==='success'">
        {{ msg }}
      </p>
    </form>
  </div>
</div>
