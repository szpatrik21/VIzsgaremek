<app-admin-navbar></app-admin-navbar>

<div class="dashboard-layout">
  <aside class="dashboard-sidebar">
    <div class="dashboard-sidebar-logo">Menü</div>

    <nav class="dashboard-sidebar-menu">
      <a
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Főoldal
      </a>

      <a routerLink="/admin/carcreate" routerLinkActive="active">
        Autó feltöltés
      </a>

      <a routerLink="/admin/cars" routerLinkActive="active">
        Autók kezelése
      </a>
      
      <a routerLink="/admin/users" routerLinkActive="active">
        Felhasználók kezelése
      </a>
    </nav>
  </aside>

  <main class="dashboard-main">
    <div class="dashboard-panel">
      <div class="upload-page">
        <h2 class="upload-title">Új autó feltöltése</h2>

        <p
          class="upload-status"
          *ngIf="msg"
          [class.success]="msgOk"
          [class.error]="!msgOk"
        >
          {{ msg }}
        </p>

        <form [formGroup]="form" (ngSubmit)="submit()" class="upload-form">
          <div class="upload-files">
            <div class="upload-field">
              <label for="image1">Első kép:</label>
              <input
                id="image1"
                type="file"
                accept="image/*"
                (change)="onFile1($event)"
                required
              >
            </div>

            <div class="upload-field">
              <label for="image2">Második kép:</label>
              <input
                id="image2"
                type="file"
                accept="image/*"
                (change)="onFile2($event)"
                required
              >
            </div>
          </div>

          <h2 class="upload-title small">Műszaki adatok</h2>

          <div class="upload-columns">
            <div class="upload-card">
              <div class="upload-row">
                <label for="marka">Márka:</label>
                <select id="marka" formControlName="marka" required>
                  <option value="">Válassz</option>
                  <option *ngFor="let b of brands" [value]="b">{{ b }}</option>
                </select>
              </div>

              <div class="upload-row">
                <label for="modell">Modell:</label>
                <input id="modell" formControlName="modell" required>
              </div>

              <div class="upload-row">
                <label for="evjarat">Évjárat:</label>
                <input id="evjarat" type="number" formControlName="evjarat" required>
              </div>

              <div class="upload-row">
                <label for="kilometerora">Kilométeróra:</label>
                <input id="kilometerora" type="number" formControlName="kilometerora" required>
              </div>

              <div class="upload-row">
                <label for="ajtok_szama">Ajtók száma:</label>
                <select id="ajtok_szama" formControlName="ajtok_szama" required>
                  <option [value]="2">2</option>
                  <option [value]="3">3</option>
                  <option [value]="4">4</option>
                  <option [value]="5">5</option>
                </select>
              </div>

              <div class="upload-row">
                <label for="uzemanyag">Üzemanyag:</label>
                <select id="uzemanyag" formControlName="uzemanyag" required>
                  <option>Benzin</option>
                  <option>Dízel</option>
                  <option>Elektromos</option>
                  <option>Hibrid</option>
                </select>
              </div>

              <div class="upload-row">
                <label for="teljesitmeny">Teljesítmény (LE):</label>
                <input id="teljesitmeny" type="number" formControlName="teljesitmeny" required>
              </div>

              <div class="upload-row">
                <label for="ar">Ár (Ft):</label>
                <input id="ar" type="number" formControlName="ar" required>
              </div>
            </div>

            <div class="upload-card">
              <div class="upload-row">
                <label for="kivitel">Kivitel:</label>
                <select id="kivitel" formControlName="kivitel" required>
                  <option>Kupé</option>
                  <option>Szabadidő-autó</option>
                  <option>Limuzin</option>
                  <option>Terepjáró</option>
                  <option>Kabrió</option>
                </select>
              </div>

              <div class="upload-row">
                <label for="allapot">Állapot:</label>
                <select id="allapot" formControlName="allapot" required>
                  <option>Új</option>
                  <option>Újszerű</option>
                  <option>Megkímélt</option>
                  <option>Normál</option>
                </select>
              </div>

              <div class="upload-row">
                <label for="szemelyek_szama">Személyek száma:</label>
                <select id="szemelyek_szama" formControlName="szemelyek_szama" required>
                  <option [value]="2">2</option>
                  <option [value]="4">4</option>
                  <option [value]="5">5</option>
                </select>
              </div>

              <div class="upload-row">
                <label for="szin">Szín:</label>
                <select id="szin" formControlName="szin" required>
                  <optgroup label="Klasszikus elegáns">
                    <option>Fehér</option>
                    <option>Gyöngyház fehér</option>
                    <option>Fekete</option>
                    <option>Matt fekete</option>
                  </optgroup>
                  <optgroup label="Fémes / Metál">
                    <option>Ezüst</option>
                    <option>Szürke</option>
                    <option>Grafitszürke</option>
                    <option>Arany</option>
                    <option>Bronz</option>
                  </optgroup>
                  <optgroup label="Prémium mély árnyalatok">
                    <option>Kék</option>
                    <option>Zöld</option>
                    <option>Bordó</option>
                    <option>Barna</option>
                    <option>Bézs</option>
                  </optgroup>
                  <optgroup label="Sportos karakter">
                    <option>Piros</option>
                    <option>Sárga</option>
                    <option>Narancssárga</option>
                    <option>Lila</option>
                  </optgroup>
                  <optgroup label="Exkluzív különlegesség">
                    <option>Türkiz</option>
                    <option>Tükörkróm</option>
                  </optgroup>
                </select>
              </div>

              <div class="upload-row">
                <label for="sebessegvalto">Sebességváltó:</label>
                <select id="sebessegvalto" formControlName="sebessegvalto" required>
                  <option>Manuális</option>
                  <option>Automata</option>
                </select>
              </div>

              <div class="upload-row">
                <label for="hengerurtartalom">Hengerűrtartalom (cm³):</label>
                <input id="hengerurtartalom" type="number" formControlName="hengerurtartalom" required>
              </div>

              <div class="upload-row">
                <label for="raktaron">Raktáron (db):</label>
                <input id="raktaron" type="number" formControlName="raktaron" required>
              </div>

              <div class="upload-row">
                <label for="kiemelt">Kiemelt:</label>
                <select id="kiemelt" formControlName="kiemelt">
                  <option [value]="0">Nem</option>
                  <option [value]="1">Igen</option>
                </select>
              </div>
            </div>
          </div>

          <button class="upload-btn" type="submit" [disabled]="loading">
            {{ loading ? 'Feltöltés...' : 'Autó feltöltése' }}
          </button>
        </form>
      </div>
    </div>
  </main>
</div>
