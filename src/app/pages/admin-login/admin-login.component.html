<div class="admin-page">
  <div class="page">
    <div class="box">
      <h2>Admin Belépés</h2>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>Email</label>
        <input type="email" formControlName="email">

        <label>Jelszó</label>
        <input type="password" formControlName="password">

        <div class="msg-space">
          <p class="success" *ngIf="successMsg">{{ successMsg }}</p>
          <p class="err" *ngIf="!successMsg && errorMsg">{{ errorMsg }}</p>
        </div>

        <button class="gomb" type="submit" [disabled]="loading">
          {{ loading ? 'Beléptetés...' : 'Belépés' }}
        </button>
      </form>
    </div>
  </div>
</div>
