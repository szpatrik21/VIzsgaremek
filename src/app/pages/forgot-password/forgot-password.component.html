<app-navbar></app-navbar>

<div class="forgot-page">
  <div class="forgot-wrapper">
    <h2>Elfelejtett jelszó</h2>
    <p class="subtext">
      Add meg az email címedet, és küldünk egy linket a jelszó visszaállításához.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Email cím</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="pelda@email.com"
          required
        >
      </div>

      <div class="back-wrapper">
        <a class="back-link" routerLink="/login">Vissza a bejelentkezéshez</a>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Folyamatban…' : 'Visszaállító link küldése' }}
      </button>

      <p id="msg" [class.error]="msgType==='error'" [class.success]="msgType==='success'">
        {{ msg }}
      </p>
    </form>
  </div>
</div>
